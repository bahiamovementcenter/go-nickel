name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    name: test
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.25.2'

      - name: test
        run: go test .

  # The nickel_embed build: linked against nickel-embed's C library (rust-nickel's
  # nickel-embed-capi), which adds package maps and more to Nickel's C API.
  embed:
    runs-on: ubuntu-latest
    env:
      # The rust-nickel commit to build; bump it to pick up new C API functions.
      RUST_NICKEL_REV: 268127d9cb3431eec6543e61e623541913209da2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: bahiamovementcenter/rust-nickel
          ref: ${{ env.RUST_NICKEL_REV }}
          path: rust-nickel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-nickel
      - run: cargo build --release -p nickel-embed-capi
        working-directory: rust-nickel
      - name: Header matches the library's
        run: diff include/nickel_lang.h rust-nickel/nickel-embed-capi/include/nickel_lang.h
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.25.2'
      # Removing the shared library links the archive, as a release build would.
      - run: rm rust-nickel/target/release/libnickel_lang.so
      - run: go test -tags nickel_embed .
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/rust-nickel/target/release
