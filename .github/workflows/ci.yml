name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    name: test
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '>=1.25.2'

      - run: go vet .
      - name: test
        run: go test .

  # lib/ and link.go come from the rust-nickel release named in RUST_NICKEL_VERSION.
  lib:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends llvm-18
      - run: scripts/update-lib.sh "$(cat RUST_NICKEL_VERSION)"
        env:
          LLVM_OBJCOPY: llvm-objcopy-18
      - name: lib/, include/ and link.go match that release
        run: git diff --exit-code
